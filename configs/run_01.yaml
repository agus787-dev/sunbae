# Run 01: first baseline model for Sunbae (mixture of uz_wiki + uz_news + fineweb2_uz, tokenizer v1)

run:
  name: run_01
  seed: 42
  device: auto           # cuda -> mps (Mac GPU) -> cpu

model:
  vocab_size: 8000       # must match tokenizer/tokenizer.json
  block_size: 256        # context length (tokens)
  n_layer: 6             # number of transformer blocks
  n_head: 6              # query heads
  d_model: 384           # embedding size; head_dim = 384 / 6 = 64
  mlp_ratio: 4           # FFN hidden = 4 * 384 = 1536
  tie_weights: true      # embedding and LM head share one matrix
  dropout: 0.1

data:
  train_bin: dataset/train.bin
  val_bin: dataset/val.bin
  meta: dataset/meta.json

training:
  batch_size: 32
  grad_accum_steps: 4        # 32 * 4 * 256 = 32,768 tokens per step
  max_steps: 8000            # ~262M tokens, about 0.8 pass over 328M train tokens
  warmup_steps: 200
  lr_max: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_interval: 20
  eval_interval: 250
  eval_iters: 50
  checkpoint_interval: 250
  precision: auto            # bf16 if supported, else fp16 on CUDA (T4), else fp32
  out_dir: checkpoints
